server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-markets
              uri: ${MARKETS_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/markets/**
            - id: ms-clientes
              uri: ${CLIENTES_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/clientes/**
            - id: ms-pedidos
              uri: ${PEDIDOS_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/incidents/**,/api/v1/suppliers/**,/api/v1/purchases/**,/api/v1/status-change-requests/**
            # La asignacion directa en inventario se bloquea: solo ms-pedidos asigna (servicio a servicio).
            # Debe ir ANTES de la ruta ms-inventory.
            - id: block-inventory-allocation
              uri: no://op
              predicates:
                - Path=/api/v1/inventory/units/*/allocation
              filters:
                - SetStatus=403
            # Las entradas por compra solo las registra ms-pedidos (servicio a servicio).
            - id: block-inventory-purchase-entries
              uri: no://op
              predicates:
                - Path=/api/v1/inventory/purchase-entries/**
              filters:
                - SetStatus=403
            - id: ms-inventory
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/inventory/**
            - id: ms-auth
              uri: ${AUTH_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/usuarios/**,/api/v1/roles/**,/api/v1/permisos/**,/api/v1/aplicaciones-externas/**,/api/v1/autorizacion/**
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validamos la firma contra las JWKS de Keycloak; no usamos issuer-uri
          # para evitar el mismatch localhost (cliente) vs keycloak (red docker) en el claim "iss".
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/microservicios/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
