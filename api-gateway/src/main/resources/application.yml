server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-markets
              uri: ${MARKETS_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/markets/**
            - id: ms-clientes
              uri: ${CLIENTES_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/clientes/**
            - id: ms-pedidos
              uri: ${PEDIDOS_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/pedidos/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
