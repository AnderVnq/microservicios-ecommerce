server:
  port: 8083

spring:
  application:
    name: ms-pedidos
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pedidos;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

clientes-service:
  base-url: ${CLIENTES_SERVICE_URI:http://localhost:8082}
