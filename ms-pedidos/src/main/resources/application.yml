server:
  port: 8083

spring:
  application:
    name: ms-pedidos
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pedidos;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/microservicios/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info

orders:
  importer-quota:
    max-units-per-year: 3

clientes:
  base-url: ${CLIENTES_SERVICE_URI:http://localhost:8082}
