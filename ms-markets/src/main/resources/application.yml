server:
  port: 8081

spring:
  application:
    name: ms-markets
  datasource:
    url: ${DB_URL:jdbc:h2:mem:markets;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
