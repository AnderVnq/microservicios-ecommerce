server:
  port: 8085

spring:
  application:
    name: ms-inventory
  datasource:
    url: ${DB_URL:jdbc:h2:mem:inventory;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/microservicios/protocol/openid-connect/certs}

inventory:
  allocation:
    # Solo el client credentials de este client id puede asignar/liberar unidades (claim azp del JWT).
    allowed-client-id: ${INVENTORY_ALLOCATION_ALLOWED_CLIENT_ID:ms-pedidos}

products:
  base-url: ${PRODUCTS_SERVICE_URI:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info
